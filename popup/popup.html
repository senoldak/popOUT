<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>popOUT - Intelligent Popup Blocker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-container">
          <img src="../assets/icon48.png" alt="popOUT Logo" class="brand-logo">
        </div>
        <div class="brand-text">
          <h1>pop<span class="highlight">OUT</span></h1>
          <span class="version-tag">v1.1</span>
        </div>
      </div>
      <label class="switch" title="Toggle Protection">
        <input type="checkbox" id="globalToggle" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <!-- Main Active Site Card -->
    <main class="content-area">
      <div class="card active-site-card">
        <div class="site-status-ring"></div>
        <div class="site-details">
          <span class="card-subtitle">Active Protection</span>
          <h2 class="domain-title" id="currentDomain">loading...</h2>
        </div>
        <button class="btn btn-whitelist" id="whitelistBtn">
          <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span id="whitelistBtnText">Whitelist Site</span>
        </button>
      </div>

      <!-- Feature Toggles Row -->
      <div class="card feature-toggle-card">
        <div class="feature-info">
          <span class="feature-title">Block Cookie & GDPR Overlays</span>
          <span class="feature-desc">Auto-hide modal consent dialogues</span>
        </div>
        <label class="switch small-switch" title="Toggle Cookie/Overlay Blocking">
          <input type="checkbox" id="overlayToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon-wrapper red-glow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
          </div>
          <div class="stat-data">
            <span class="stat-number" id="tabBlockedCount">0</span>
            <span class="stat-caption">Tab Blocked</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon-wrapper cyan-glow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div class="stat-data">
            <span class="stat-number" id="totalBlockedCount">0</span>
            <span class="stat-caption">Lifetime Total</span>
          </div>
        </div>
      </div>

      <!-- Blocked Popups List Section -->
      <section class="blocked-section">
        <div class="section-header">
          <h3>Intercepted Windows</h3>
          <span class="badge" id="listBadge">0</span>
        </div>
        <div class="blocked-scroll-container" id="blockedList">
          <div class="empty-state">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            <p>No popups intercepted on this page.</p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
